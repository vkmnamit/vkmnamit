<svg width="100%" height="120" viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="120" fill="url(#footerGradient)"/>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accentGradient)"/>
  
  <!-- Main text -->
  <text x="600" y="50" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
    Let's build something exceptional
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="75" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">
    Open to opportunities & collaborations
  </text>
  
  <!-- Contact info -->
  <text x="600" y="100" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">
    vkmnamit@gmail.com
  </text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="60" r="30" fill="none" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.2"/>
  <circle cx="1100" cy="60" r="30" fill="none" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.2"/>
</svg>