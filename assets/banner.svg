<svg width="100%" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="200" fill="url(#gradient1)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="200" fill="url(#grid)"/>
  
  <!-- Accent line -->
  <rect x="0" y="195" width="1200" height="5" fill="url(#gradient2)"/>
  
  <!-- Main text -->
  <text x="60" y="85" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="700" fill="#ffffff">
    Namit Raj
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="125" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#a0a0a0">
    Software Engineer
  </text>
  
  <!-- Tagline -->
  <text x="60" y="155" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" font-weight="400" fill="#6b7280">
    Building production-grade systems across backend, cloud & AI
  </text>
  
  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="60" fill="none" stroke="url(#gradient2)" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="100" r="45" fill="none" stroke="url(#gradient2)" stroke-width="1" opacity="0.2"/>
  <circle cx="1100" cy="100" r="30" fill="none" stroke="url(#gradient2)" stroke-width="1" opacity="0.1"/>
</svg>